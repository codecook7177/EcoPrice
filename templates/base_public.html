<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoPrice{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}?v=1.3">
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('ecoprice-theme', next);

            // Update toggle button text
            document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
                btn.textContent = next === 'dark' ? 'DARK' : 'LIGHT';
            });
        }

        // Restore saved theme
        (function() {
            const saved = localStorage.getItem('ecoprice-theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>

    <!-- Ambient Audio File (custom music) -->
    <audio id="ambient-audio" preload="auto">
        <source src="{{ url_for('static', filename='audio/ambient.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- Ambient Sound System -->
    <script src="{{ url_for('static', filename='js/ambient.js') }}"></script>

    <!-- Floating Ambient Controls -->
    <div class="ambient-controls" id="ambient-controls">
        <input type="range" class="volume-slider" min="0" max="100" value="15"
               oninput="AmbientSound.setVolume(this.value / 100)">
        <button class="btn-ambient" id="btn-ambient" onclick="toggleAmbient()" title="Toggle ambient sound">
            &#9835;
        </button>
    </div>

    <script>
        function toggleAmbient() {
            var playing = AmbientSound.toggle();
            var btn = document.getElementById('btn-ambient');
            if (playing) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
